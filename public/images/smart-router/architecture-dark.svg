<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="880" height="360" fill="#0b0b0d"/>
  <g stroke="#3f3f46" stroke-width="1.6" fill="none">
    <path d="M206 180h48"/><path d="M462 180h48"/>
    <path d="M700 180c14 0 18-52 32-52h18"/><path d="M700 180h50"/><path d="M700 180c14 0 18 52 32 52h18"/>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none" opacity=".85">
    <path d="M206 180h48"/><path d="M462 180h48"/>
  </g>

  <g>
    <rect x="44" y="146" width="162" height="68" rx="10" fill="#17171a" stroke="#2a2a30"/>
    <text x="125" y="176" text-anchor="middle" font-size="14.5" font-weight="650" fill="#f4f4f5">your prompt</text>
    <text x="125" y="195" text-anchor="middle" font-size="11.5" fill="#71717a">text, files, images</text>
  </g>

  <g>
    <rect x="254" y="140" width="208" height="80" rx="11" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="358" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#2dd4bf">smart router</text>
    <text x="358" y="188" text-anchor="middle" font-size="11.5" fill="#5eead4">classify, price, pick</text>
    <text x="358" y="204" text-anchor="middle" font-size="11.5" fill="#5eead4">locally, in about a millisecond</text>
  </g>

  <g>
    <rect x="510" y="140" width="190" height="80" rx="11" fill="#17171a" stroke="#2a2a30"/>
    <text x="605" y="169" text-anchor="middle" font-size="14.5" font-weight="650" fill="#f4f4f5">OpenCode</text>
    <text x="605" y="188" text-anchor="middle" font-size="11.5" fill="#71717a">loads the plugin</text>
    <text x="605" y="203" text-anchor="middle" font-size="11.5" fill="#71717a">sends the step</text>
  </g>

  <g font-size="12.5" font-weight="600">
    <rect x="762" y="98" width="96" height="46" rx="9" fill="#0b0b0d" stroke="#2a2a30"/>
    <text x="810" y="126" text-anchor="middle" fill="#d4d4d8">provider A</text>
    <rect x="762" y="157" width="96" height="46" rx="9" fill="#0b0b0d" stroke="#2a2a30"/>
    <text x="810" y="185" text-anchor="middle" fill="#d4d4d8">provider B</text>
    <rect x="762" y="216" width="96" height="46" rx="9" fill="#0b0b0d" stroke="#2a2a30"/>
    <text x="810" y="244" text-anchor="middle" fill="#d4d4d8">provider C</text>
  </g>

  <g>
    <rect x="44" y="252" width="176" height="52" rx="9" fill="#141417" stroke="#2a2a30"/>
    <text x="132" y="273" text-anchor="middle" font-size="11.5" font-weight="650" fill="#d4d4d8">your quota</text>
    <text x="132" y="290" text-anchor="middle" font-size="11" fill="#71717a">windows, credits, reset times</text>
    <path d="M132 252V214" stroke="#3f3f46" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>
  </g>

  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#71717a">Costs are modeled from the plan you bought, not from a per-token price list.</text>
