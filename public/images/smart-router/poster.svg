<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06110f"/>
      <stop offset="0.6" stop-color="#08161a"/>
      <stop offset="1" stop-color="#050a0c"/>
    </linearGradient>
    <radialGradient id="sr-glow" cx="0.5" cy="0.06" r="0.72">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#sr-bg)"/>
  <rect width="1280" height="800" fill="url(#sr-glow)"/>

  <g transform="translate(96,92)">
    <g fill="none" stroke="url(#sr-accent)" stroke-width="4.5" stroke-linecap="round">
      <path d="M0 44h20"/>
      <path d="M20 44c12 0 14-20 26-20h16"/>
      <path d="M20 44c12 0 14 20 26 20h16"/>
      <path d="M20 44h42"/>
    </g>
    <circle cx="0" cy="44" r="6" fill="url(#sr-accent)"/>
    <g fill="url(#sr-accent)">
      <rect x="66" y="16" width="15" height="15" rx="4"/>
      <rect x="66" y="37" width="15" height="15" rx="4"/>
      <rect x="66" y="58" width="15" height="15" rx="4"/>
    </g>
    <text x="98" y="42" font-size="33" font-weight="700" fill="#f4f4f5" letter-spacing="-0.8">smart router</text>
    <text x="99" y="65" font-size="15" font-weight="500" fill="#5eead4" letter-spacing="1.4">FOR OPENCODE</text>
  </g>

  <text x="96" y="264" font-size="52" font-weight="700" fill="#fafafa" letter-spacing="-1.4">Routes by your plan,</text>
  <text x="96" y="326" font-size="52" font-weight="700" fill="url(#sr-accent)" letter-spacing="-1.4">not a price list.</text>

  <text x="96" y="382" font-size="21" fill="#94a3b8">Subscription-aware model routing for coding agents.</text>

  <g transform="translate(96,452)">
    <rect x="0" y="0" width="216" height="96" rx="12" fill="#0d2b26" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="24" y="38" font-size="15" font-weight="700" fill="#5eead4">commandcode</text>
    <text x="24" y="62" font-size="13" fill="#94a3b8">resets in 40 minutes</text>
    <text x="24" y="82" font-size="12" fill="#2dd4bf">spend it now</text>

    <path d="M220 48h44" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="268" y="0" width="216" height="96" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="292" y="38" font-size="15" font-weight="700" fill="#e2e8f0">opendesign</text>
    <text x="292" y="62" font-size="13" fill="#94a3b8">largest pool</text>
    <text x="292" y="82" font-size="12" fill="#64748b">safe default</text>

    <path d="M488 48h44" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="536" y="0" width="216" height="96" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="560" y="38" font-size="15" font-weight="700" fill="#e2e8f0">opencode-go</text>
    <text x="560" y="62" font-size="13" fill="#94a3b8">90% monthly used</text>
    <text x="560" y="82" font-size="12" fill="#64748b">held in reserve</text>
  </g>

  <g transform="translate(96,616)">
    <rect x="0" y="0" width="656" height="1" fill="#1e293b"/>
    <text x="0" y="42" font-size="15" fill="#64748b">Three subscriptions. One decision per prompt. Nothing expires unused.</text>
  </g>

  <g transform="translate(880,470)">
    <circle cx="120" cy="120" r="118" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="120" cy="120" r="86" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M120 2a118 118 0 0 1 0 236" fill="none" stroke="url(#sr-accent)" stroke-width="7" stroke-linecap="round"/>
    <text x="120" y="112" text-anchor="middle" font-size="15" fill="#94a3b8">MIT</text>
    <text x="120" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#f4f4f5">491</text>
    <text x="120" y="162" text-anchor="middle" font-size="12" fill="#64748b">tests passing</text>
  </g>
</svg>
